name: Update homepage Facebook videos

on:
  workflow_dispatch:
  schedule:
    # Weekly check (every Monday). Adjust anytime.
    - cron: "15 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Update last 3 videos from Facebook
        run: node scripts/update-facebook-videos.mjs
        env:
          # Optional: override the page URL if needed
          FACEBOOK_PROFILE_REELS_URL: ${{ secrets.FACEBOOK_PROFILE_REELS_URL }}

      - name: Commit + push if changed
        run: |
          if git diff --quiet; then
            echo "No updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/facebookVideos.json
          git commit -m "chore: update homepage facebook reels"
          git push

